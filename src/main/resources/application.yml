spring:
  application:
    name: agent-server
  datasource:
    url: jdbc:sqlite:${AGENT_DB_PATH:./agent.db}
    driver-class-name: org.sqlite.JDBC
  jdbc:
    initialize-schema: never

agent:
  max-iterations: ${AGENT_MAX_ITERATIONS:8}
  memory:
    type: ${AGENT_MEMORY_TYPE:sqlite}
  skills:
    enabled: ${AGENT_SKILLS_ENABLED:true}
    path: ${AGENT_SKILLS_PATH:./skills}
    max-results: ${AGENT_SKILLS_MAX_RESULTS:5}
    min-score: ${AGENT_SKILLS_MIN_SCORE:2}
  long-term-memory:
    enabled: ${AGENT_LTM_ENABLED:true}
    max-inject: ${AGENT_LTM_MAX_INJECT:8}
    max-content-length: ${AGENT_LTM_MAX_LEN:200}
    extraction:
      enabled: ${AGENT_LTM_EXTRACT_ENABLED:true}
      gate-enabled: ${AGENT_LTM_GATE_ENABLED:true}
      min-importance: ${AGENT_LTM_MIN_IMPORTANCE:4}
      timeout: ${AGENT_LTM_EXTRACT_TIMEOUT:15s}
  rag:
    enabled: ${AGENT_RAG_ENABLED:true}
    upload-dir: ${AGENT_RAG_UPLOAD_DIR:./uploads/rag}
    max-file-size: ${AGENT_RAG_MAX_FILE_SIZE:5MB}
    max-results: ${AGENT_RAG_MAX_RESULTS:5}
    chunk-size: ${AGENT_RAG_CHUNK_SIZE:500}
    chunk-overlap: ${AGENT_RAG_CHUNK_OVERLAP:50}
    supported-types: ${AGENT_RAG_TYPES:md,txt,log}

tool:
  timeout: ${TOOL_TIMEOUT:30s}

prompt:
  system: ${AGENT_SYSTEM_PROMPT:You are a helpful desktop agent.}

# provider: ${LLM_PROVIDER:openrouter}
# base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
llm:
  provider: ${LLM_PROVIDER:openai-compatible}
  base-url: ${LLM_BASE_URL:https://api.xiaomimimo.com/v1}
  api-key: ${LLM_API_KEY}
  model: ${LLM_MODEL:mimo-v2.5}


mcp:
  servers:
    github:
      enabled: true
      command: D:/workspace/mcpserver/github-mcp-server/bin/github-mcp-server.exe
      workingDirectory: D:/workspace/mcpserver/github-mcp-server
      args:
        - stdio
        - --log-file
        - D:/workspace/mcpserver/github-mcp.log
    filesystem:
      enabled: true
      command: C:/Program Files/nodejs/npx.cmd
      workingDirectory: D:/workspace/mcpserver/agent-client01
      args:
        - "-y"
        - "@modelcontextprotocol/server-filesystem"
        - "D:/workspace"

web-search:
  tavily:
    enabled: ${TAVILY_ENABLED:true}
    api-key: ${TAVILY_API_KEY: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}
    base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    max-results: ${TAVILY_MAX_RESULTS:5}
    search-depth: ${TAVILY_SEARCH_DEPTH:basic}
    timeout: ${TAVILY_TIMEOUT:10s}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

logging:
  level:
    com.david.agent: INFO


weather:
  open-meteo:
    enabled: ${WEATHER_OPEN_METEO_ENABLED:true}
    geocoding-base-url: ${WEATHER_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com/v1}
    forecast-base-url: ${WEATHER_FORECAST_BASE_URL:https://api.open-meteo.com/v1}
    forecast-days: ${WEATHER_FORECAST_DAYS:7}
    timeout: ${WEATHER_TIMEOUT:8s}

finance:
  stock:
    sina:
      enabled: ${FINANCE_SINA_ENABLED:true}
      base-url: ${FINANCE_SINA_BASE_URL:https://money.finance.sina.com.cn}
      kline-path: ${FINANCE_SINA_KLINE_PATH:/quotes_service/api/json_v2.php/CN_MarketData.getKLineData}
      scale: ${FINANCE_SINA_SCALE:240}
      max-data-length: ${FINANCE_SINA_MAX_DATALEN:200}
      timeout: ${FINANCE_SINA_TIMEOUT:8s}
